  <main class="page-body">
    <div class="page-section img-diff">
      <h1 class="section-head">Image Diff</h1>
      <p class="text-muted">Compare two images of the same size with PSNR and SSIM. Everything runs in your browser;
        nothing is uploaded.</p>

      <div class="img-diff__inputs">
        <label class="drop-zone" data-slot="0">
          <input type="file" accept="image/*" class="drop-zone__input">
          <span class="drop-zone__label">Reference</span>
          <img class="drop-zone__preview" alt="" hidden>
          <span class="drop-zone__hint">Drop an image here or click to choose</span>
          <span class="drop-zone__meta"></span>
        </label>
        <label class="drop-zone" data-slot="1">
          <input type="file" accept="image/*" class="drop-zone__input">
          <span class="drop-zone__label">Test</span>
          <img class="drop-zone__preview" alt="" hidden>
          <span class="drop-zone__hint">Drop an image here or click to choose</span>
          <span class="drop-zone__meta"></span>
        </label>
      </div>

      <div class="img-diff__actions">
        <button type="button" class="pub-action img-diff__calc" disabled>Calculate</button>
        <span class="img-diff__status" role="status"></span>
      </div>

      <section class="img-diff__results" hidden>
        <div class="img-diff__scores">
          <div class="score-tile">
            <span class="score-tile__label">PSNR</span>
            <span class="score-tile__value" data-score="psnr"></span>
          </div>
          <div class="score-tile">
            <span class="score-tile__label">SSIM</span>
            <span class="score-tile__value" data-score="ssim"></span>
          </div>
        </div>

        <div class="img-diff__maps">
          <figure class="heat-map">
            <figcaption class="heat-map__caption">SSIM dissimilarity (1 &minus; SSIM)</figcaption>
            <canvas class="heat-map__canvas" data-map="ssim"></canvas>
            <button type="button" class="pub-action heat-map__save" data-save="ssim">Save PNG</button>
          </figure>
          <figure class="heat-map">
            <figcaption class="heat-map__caption">Absolute error |ref &minus; test|</figcaption>
            <canvas class="heat-map__canvas" data-map="err"></canvas>
            <button type="button" class="pub-action heat-map__save" data-save="err">Save PNG</button>
          </figure>
        </div>
      </section>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
